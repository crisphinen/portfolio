<svg width="400" height="240" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <rect width="400" height="240" fill="#f8f8f8" stroke="#ddd" stroke-width="1" rx="4"/>
  <text x="200" y="22" text-anchor="middle" font-size="11" fill="#888">IoT Localization — System Overview</text>

  <!-- Floor plan grid -->
  <rect x="30" y="35" width="220" height="185" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
  <!-- grid lines -->
  <line x1="30" y1="97" x2="250" y2="97" stroke="#eee" stroke-width="1"/>
  <line x1="30" y1="158" x2="250" y2="158" stroke="#eee" stroke-width="1"/>
  <line x1="103" y1="35" x2="103" y2="220" stroke="#eee" stroke-width="1"/>
  <line x1="177" y1="35" x2="177" y2="220" stroke="#eee" stroke-width="1"/>

  <!-- Anchors (fixed nodes) -->
  <rect x="38" y="43" width="14" height="14" fill="#4a90d9" rx="2"/>
  <text x="45" y="53" text-anchor="middle" font-size="7" fill="#fff">A</text>
  <rect x="228" y="43" width="14" height="14" fill="#4a90d9" rx="2"/>
  <text x="235" y="53" text-anchor="middle" font-size="7" fill="#fff">A</text>
  <rect x="38" y="203" width="14" height="14" fill="#4a90d9" rx="2"/>
  <text x="45" y="213" text-anchor="middle" font-size="7" fill="#fff">A</text>
  <rect x="228" y="203" width="14" height="14" fill="#4a90d9" rx="2"/>
  <text x="235" y="213" text-anchor="middle" font-size="7" fill="#fff">A</text>

  <!-- Mobile node -->
  <circle cx="140" cy="128" r="10" fill="#e74c3c" opacity="0.85"/>
  <text x="140" y="132" text-anchor="middle" font-size="8" fill="#fff">M</text>

  <!-- RSSI lines from mobile to anchors -->
  <line x1="45" y1="50" x2="133" y2="120" stroke="#4a90d9" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="235" y1="50" x2="148" y2="120" stroke="#4a90d9" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="45" y1="210" x2="133" y2="136" stroke="#4a90d9" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="235" y1="210" x2="148" y2="136" stroke="#4a90d9" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Legend -->
  <rect x="38" y="95" width="8" height="8" fill="#4a90d9" rx="1"/>
  <text x="50" y="103" font-size="8" fill="#666">Anchor</text>
  <circle cx="42" cy="115" r="5" fill="#e74c3c" opacity="0.85"/>
  <text x="50" y="119" font-size="8" fill="#666">Mobile node</text>

  <!-- Stats panel right -->
  <rect x="265" y="35" width="120" height="185" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
  <text x="325" y="58" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">Results</text>
  <line x1="275" y1="65" x2="375" y2="65" stroke="#eee" stroke-width="1"/>

  <text x="275" y="85" font-size="9" fill="#777">Accuracy</text>
  <text x="375" y="85" text-anchor="end" font-size="9" fill="#27ae60" font-weight="bold">99%</text>

  <text x="275" y="108" font-size="9" fill="#777">Response</text>
  <text x="375" y="108" text-anchor="end" font-size="9" fill="#555">3 sec avg</text>

  <text x="275" y="131" font-size="9" fill="#777">Hardware</text>
  <text x="375" y="131" text-anchor="end" font-size="9" fill="#555">Constrained</text>

  <text x="275" y="154" font-size="9" fill="#777">Protocol</text>
  <text x="375" y="154" text-anchor="end" font-size="9" fill="#555">RSSI/IoT</text>

  <text x="275" y="177" font-size="9" fill="#777">Real-time</text>
  <text x="375" y="177" text-anchor="end" font-size="9" fill="#27ae60">✓</text>
</svg>
