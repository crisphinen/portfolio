{{ $dest := .Destination | relURL | safeURL }}
{{ $newTab := or (hasPrefix .Destination "http://") (hasPrefix .Destination "https://") (hasSuffix .Destination ".pdf") }}
<a href="{{ $dest }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $newTab }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Text | safeHTML }}</a>
